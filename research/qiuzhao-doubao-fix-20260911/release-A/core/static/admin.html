<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 · 秋招岗位库</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div class="container">
    <h1>🔐 管理后台</h1>

    <!-- 登录区域 -->
    <div id="login-section">
      <div class="section">
        <h2>管理员登录</h2>
        <div class="form-group">
          <label for="admin-token">管理员Token</label>
          <input type="password" id="admin-token" placeholder="输入管理员Token">
        </div>
        <button onclick="login()">登录</button>
        <div id="login-result" class="result"></div>
      </div>
    </div>

    <!-- 管理区域 -->
    <div id="admin-section" style="display: none;">
      <!-- 统计 -->
      <div class="section">
        <h2>📊 概览</h2>
        <div class="stats">
          <div class="stat-card">
            <div class="stat-number" id="stat-total">—</div>
            <div class="stat-label">总兑换码</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-redeemed">—</div>
            <div class="stat-label">已兑换</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-pending">—</div>
            <div class="stat-label">未兑换</div>
          </div>
        </div>
      </div>

      <!-- 生成兑换码 -->
      <div class="section">
        <h2>🎫 生成兑换码</h2>
        <div class="form-group">
          <label for="code-count">生成数量</label>
          <input type="number" id="code-count" value="1" min="1" max="100">
        </div>
        <button onclick="generateCodes()">生成兑换码</button>
        <div id="generate-result" class="result"></div>
      </div>

      <!-- 兑换码列表 -->
      <div class="section">
        <h2>📋 兑换码列表</h2>
        <button onclick="loadCodes()" style="margin-bottom: 16px;">刷新列表</button>
        <table>
          <thead>
            <tr>
              <th>兑换码（哈希）</th>
              <th>套餐</th>
              <th>创建时间</th>
              <th>状态</th>
              <th>兑换时间</th>
            </tr>
          </thead>
          <tbody id="codes-table-body">
            <tr><td colspan="5" style="text-align: center; color: #999;">加载中...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 分销统计 -->
      <div class="section">
        <h2>💰 分销统计</h2>
        <button onclick="loadDistribution()" style="margin-bottom: 16px;">刷新分销数据</button>
        <div id="dist-stats"></div>
      </div>
    </div>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
